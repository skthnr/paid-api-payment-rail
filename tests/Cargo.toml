[package]
name = "portico-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Sandbox integration tests for the portico contracts"

[dependencies]
anyhow = "1.0"
near-sdk = { version = "=5.30.1", features = ["non-contract-usage"] }
near-workspaces = "=0.24.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }

[[test]]
name = "split"
path = "split.rs"

[[test]]
name = "registry"
path = "registry.rs"

[[test]]
name = "stream"
path = "stream.rs"
