[package]
name = "portico-revenue-split"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Portico revenue split, tool registry, per-block streams and public ledger on NEAR"
license = "Apache-2.0"

[lib]
name = "portico_revenue_split"
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.1"
near-contract-standards = "=5.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Host-side unit tests: near-sdk rejects non-wasm builds unless this feature is
# enabled on the test dependency edge.
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
overflow-checks = true
